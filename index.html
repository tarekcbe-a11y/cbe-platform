<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أذون الخزانة - جروب عملاء البنوك المصرية</title>
    <style>
        :root {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --border-color: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-color: #f59e0b;
            --back-btn-bg: #dc2626;
            --back-btn-hover: #b91c1c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            color: var(--accent-color);
            margin: 0;
        }
        .btn-back {
            display: block;
            width: 100%;
            background-color: var(--back-btn-bg);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .btn-back:hover {
            background-color: var(--back-btn-hover);
        }
        .content-box {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- زر الرجوع للرئيسية بلون مميز -->
        <a href="https://tarekcbe-a11y.github.io/" class="btn-back">⬅️ الرجوع للرئيسية</a>

        <div class="header">
            <h1>حاسبة أذون الخزانة</h1>
        </div>

        <!-- المحتوى المخصص لأذون الخزانة بدلاً من الشهادات -->
        <div class="content-box">
            <p style="margin: 0; text-align: center;">
                مخصصة لتحليل عوائد أذون الخزانة وحساب الضرائب وصافي العائد بدقة تامة لعملاء البنوك المصرية.
            </p>
        </div>
    </div>
</body>
</html>
